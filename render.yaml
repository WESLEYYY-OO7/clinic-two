services:
  - type: web
    name: cura-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @cura/db-client exec prisma generate
    startCommand: pnpm --filter @cura/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: cura-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://cura-web.onrender.com

  - type: web
    name: cura-web
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      cd apps/web && pnpm exec next build
    startCommand: cd apps/web && pnpm exec next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://cura-api.onrender.com
      - key: WEB_ORIGIN
        value: https://cura-web.onrender.com

databases:
  - name: cura-db
    plan: free
    region: frankfurt